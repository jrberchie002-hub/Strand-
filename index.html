function terms(){legalPage('Terms of Service','<p class="mu">Last updated: '+new Date().toLocaleDateString()+'. This is a plain-language summary while Strand is in early access — it will be reviewed and formalised as we grow.</p>'
+'<h3>1. What Strand is</h3><p class="mu">Strand gives store owners ("sellers") a storefront, order and inventory tools, and a way to get paid. Strand is the platform; each shop is run by its own independent seller, not by Strand.</p>'
+'<h3>2. Accounts</h3><p class="mu">You must give accurate information to create an account and keep your login details secure. You are responsible for activity under your account, including any staff you add with team access.</p>'
+'<h3>3. Fees and plans</h3><p class="mu">Basic access is free. Sellers pay a monthly subscription only for Plus or Pro access, as described on our pricing page. On the Basic plan, Strand keeps 1.5% of payments made online through Strand (Paystack, card or mobile money) at the time of payment; this does not apply to cash, pay-on-delivery, WhatsApp-arranged payments, or your own payment link or Paystack account. Plus and Pro take no commission on what you sell. Fees already paid are not refunded except where required by law.</p>'
+'<h3>4. Getting paid</h3><p class="mu">By default, payments you accept online (card or mobile money through Paystack), by mobile money transfer, or by payment link go straight to your own account — Strand never holds or touches that money. If you ask Strand to collect payments on your behalf because you do not yet have your own Paystack account, a separate, clearly stated fee applies to that service, and funds are passed on to you.</p>'
+'<h3>5. What you can sell</h3><p class="mu">You may not list anything illegal, counterfeit, stolen, or that infringes someone else\'s rights, and you are responsible for the accuracy of your own listings, pricing and stock.</p>'
+'<h3>6. Your content</h3><p class="mu">You keep ownership of your store name, product photos, descriptions and brand. You give Strand permission to display them as part of running your storefront.</p>'
+'<h3>7. Suspension and termination</h3><p class="mu">We may suspend or close an account that breaks these terms, is used fraudulently, or puts other users at risk. You can close your own account at any time.</p>'
+'<h3>8. No guarantee</h3><p class="mu">Strand is provided "as is." We work to keep it reliable and secure but cannot guarantee uninterrupted service, and are not responsible for disputes between a seller and their customers.</p>'
+'<h3>9. Changes</h3><p class="mu">We may update these terms as Strand grows. We will show a notice in the app when a change is significant.</p>'
+'<h3>10. Contact</h3><p class="mu">Questions about these terms can be sent to the email address shown in the app footer.</p>')}
function privacy(){legalPage('Privacy Policy','<p class="mu">Last updated: '+new Date().toLocaleDateString()+'. This explains what we collect and why, in plain language.</p>'
+'<h3>1. What we collect</h3><p class="mu">From sellers: store name, phone number, email, password (stored scrambled, never in plain text), the products and settings you add, and payment details you choose to connect (we store your Paystack key encrypted; we never see or store card numbers — those go straight to Paystack). From customers: name, phone number, delivery address and order details you give a store at checkout.</p>'
+'<h3>2. Why we collect it</h3><p class="mu">To run your store and process orders, to show you your own orders and stock, to send order and security notifications, to prevent fraud and abuse, and to improve Strand.</p>'
+'<h3>3. Who sees it</h3><p class="mu">A customer\'s order details are visible to the store they ordered from and to Strand. We do not sell personal data to third parties. We share data with service providers only as needed to run the platform — for example Paystack for payments, or an email provider to send notifications.</p>'
+'<h3>4. Where it is stored</h3><p class="mu">Account and order data is stored on our hosting providers\' servers with encryption for sensitive fields like payment keys and passwords.</p>'
+'<h3>5. Your choices</h3><p class="mu">You can edit or remove your store\'s information at any time from your dashboard. You can ask us to delete your account and associated data by contacting us, except where we must keep records for legal or accounting reasons.</p>'
+'<h3>6. Cookies and local storage</h3><p class="mu">We use your browser\'s local storage to keep you signed in and remember basic preferences. We do not use advertising trackers.</p>'

ain</button>')+'</div>':'')+'</div>'}).join('')+'<h2 style="margin-top:20px">Requests</h2>'+(rq.length?rq.map(function(q){return'<div class="card"><div class="row"><b>'+esc(q.shop)+'</b><span class="st">'+q.kind+'</span><div class="sp"></div>'+(q.done?'<span class="mu">done</span>':'<button class="btn s k" onclick="reqDone(\''+q.id+'\')">Done</button>')+'</div><div class="mu" style="margin:6px 0">'+esc(q.text)+'</div>'+(q.phone?'<a href="https://wa.me/'+q.phone.replace(/\D/g,'')+'" target="_blank" rel="noopener">WhatsApp '+esc(q.phone)+'</a>':'<a href="mailto:'+esc(q.email)+'">'+esc(q.email)+'</a>')+'</div>'}).join(''):'<p class="mu">No requests.</p>')+'</div>'}).catch(function(){try{sessionStorage.removeItem('bs_a')}catch(e){}$('app').innerHTML='<div class="wrap">'+logo()+'<h1>Not found</h1></div>'})}

function adminInv(slug){var pl=prompt('Plan (pro or expert)','pro');if(!pl)return;var am=prompt('Amount received (GH₵)','0');var d=new Date(Date.now()+30*864e5).toISOString().slice(0,10);adm(slug,{plan:pl,paidUntil:d,invoice:{plan:pl,amount:+am||0,via:'Manual'}});setTimeout(admin,600)}

function platGenPw2(){var a='abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789',pw='';for(var i=0;i<10;i++)pw+=a[Math.floor(Math.random()*a.length)];pw+='!';var i2=$('hop');if(i2){i2.value=pw;i2.select()}}

 $('pbody').innerHTML=PR.length?PR.map(function(q){return'<div class="card'+(q.kind==='appeal'&&!q.done?' note':'')+'"><div class="row"><b>'+esc(q.shop)+'</b><span class="st">'+esc(q.kind)+'</span><div class="sp"></div>'+(q.done?'<span class="mu">done</span>':'<button class="btn s k" onclick="platReqDone(\''+q.id+'\')">Done</button>')+'</div><div class="mu" style="margin:6px 0">'+esc(q.text)+'</div>'+(q.phone?'<a href="https://wa.me/'+q.phone.replace(/\D/g,'')+'" target="_blank" rel="noopener">WhatsApp '+esc(q.phone)+'</a>':(q.email?'<a href="mailto:'+esc(q.email)+'">'+esc(q.email)+'</a>':''))+(q.kind==='appeal'&&!q.done?'<div class="row" style="margin-top:10px;gap:8px"><button class="btn s" onclick="platAppealLift(\''+q.slug+'\',\''+q.id+'\')">Lift suspension &amp; resolve</button></div>':'')+'</div>'}).join(''):'<p class="mu">No requests.</p>';

 $('pbody').innerHTML='<p class="mu" style="margin:-4px 0 12px">'+n+' of 25 team seats used</p>'+PTM.map(function(m){var susp=!!m.off;return'<div class="card"><div class="row"><b style="display:flex;align-items:center;gap:7px">'+esc(m.name)+(m.id===PM.id?' <span class="mu" style="font-weight:400">(you)</span>':'')+'</b><div class="sp"></div><span class="pill'+(susp?' off':'')+'">'+(susp?'Suspended':PLAT_ROLE_DESC[m.role]?PLAT_ROLE_DESC[m.role][0]:esc(m.role))+'</span></div><div class="mu" style="margin-top:2px">'+esc(m.login)+(m.lastLogin?' · last in '+new Date(m.lastLogin).toLocaleDateString():' · never signed in')+'</div>'+(owner&&m.id!==PM.id?'<div class="row" style="margin-top:8px;gap:10px;flex-wrap:wrap"><select onchange="platTeamSet(\''+m.id+'\',{role:this.value})">'+['owner','moderator','support'].map(function(x){return'<option value="'+x+'" '+(m.role===x?'selected':'')+'>'+PLAT_ROLE_DESC[x][0]+'</option>'}).join('')+'</select><button class="btn s o" onclick="platTeamSet(\''+m.id+'\',{off:'+(!m.off)+'})">'+(m.off?'Reactivate':'Suspend')+'</button><button class="btn s o" onclick="platTeamDel(\''+m.id+'\')">Remove</button></div>':'')+'</div>'}).join('')+
 (owner?'<h3 style="margin-top:18px">Add a team member</h3><p class="mu" style="margin-top:-6px">Fill this in, hit Generate for a password, then send them their login and password to sign in at /control. They should change this password the first time they sign in.</p><label for="tpn">Name</label><input id="tpn"><label for="tpi">Email or phone</label><input id="tpi"><label for="tpk">Password</label><div class="row" style="gap:8px"><input id="tpk" type="text" autocomplete="new-password" placeholder="Click Generate"><button type="button" class="btn s o" style="width:auto" onclick="platGenPw()">Generate</button></div><label for="tpr">Role</label><select id="tpr"><option value="support">Support</option><option value="moderator">Moderator</option><option value="owner">Owner</option></select><button class="btn" onclick="platTeamAdd()">Add</button><div class="err" id="tpe" role="alert"></div>':'')+
 platRoleLegend();
}).catch(function(e){$('pbody').innerHTML='<p class="err">'+esc(e.message)+'</p>'})}

function platGenPw(){var a='abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789',p='';for(var i=0;i<10;i++)p+=a[Math.floor(Math.random()*a.length)];p+='!';var i2=$('tpk');if(i2){i2.value=p;i2.select()}}

function platSecV(){Promise.all([papi('GET','/api/platform/security'),papi('GET','/api/platform/control').catch(function(){return null})]).then(function(rr){var r=rr[0],ctl=rr[1];PSEC=r.log;var alerts=r.alerts||[],fails=r.failedLogins||[];
 $('pbody').innerHTML=
  '<div class="card"><div class="row"><h3 style="margin:0">Sign-in verification</h3><div class="sp"></div><span class="pill'+(r.otpEmail&&r.emailOn?'':' off')+'">'+(r.otpEmail&&r.emailOn?'Active':'Not active')+'</span></div><p class="mu" style="margin:6px 0 0">'+(r.otpEmail?(r.emailOn?'A one-time code is emailed to you every time you sign in.':'Your account uses email, but the platform has no email sender configured — no code is sent.'):'Your account signs in with a phone number, so no email code is sent. Switch to an email login to turn this on.')+'</p></div>'+
  '<div class="card" style="margin-top:14px"><h3 style="margin-top:0">Change your password</h3><label for="psop">Current password</label><input id="psop" type="password"><label for="psnp">New password</label><input id="psnp" type="password"><button class="btn" onclick="platPwSave()">Change password</button><div class="err" id="pse" role="alert"></div><button class="btn o" style="margin-top:10px" onclick="platLogoutAll()">Log out of all devices</button></div>'+
  (ctl?'<div class="card" style="margin-top:14px"><h3 style="margin-top:0">Store name &amp; handle limits</h3><p class="mu" style="margin-top:-2px">How many times a store owner can rename their store, or change their @handle — like Snapchat limits username changes.</p><label for="pnl">Name changes allowed</label><input id="pnl" type="number" min="0" max="20" value="'+ctl.nameLimit+'"><label for="psl">Handle (@) changes allowed</label><input id="psl" type="number" min="0" max="20" value="'+ctl.slugLimit+'"><button class="btn" onclick="platCtlSave()">Save limits</button><div class="err" id="pce" role="alert"></div></div>':'')+
  (ctl?'<div class="card" style="margin-top:14px"><h3 style="margin-top:0">Landing page hero video</h3><p class="mu" style="margin-top:-2px">An autoplaying background video behind the headline on strand.com, up to 12 seconds, like Shopify\'s homepage.</p><label for="plhv">Upload video</label><input id="plhv" type="file" accept="video/*" onchange="platPickVideo(this)" style="padding:14px">'+(ctl.heroVideo?'<p class="mu" style="margin:6px 0">Hero video is on.</p><button type="button" class="btn s o" onclick="platRemoveHeroVideo()">Remove hero video</button>':'')+'<div class="err" id="plhve" role="alert"></div></div>':'')+
