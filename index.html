function terms(){legalPage('Terms of Service','<p class="mu">Last updated: '+new Date().toLocaleDateString()+'. This is a plain-language summary while Strand is in early access — it will be reviewed and formalised as we grow.</p>'
+'<h3>1. What Strand is</h3><p class="mu">Strand gives shop owners ("sellers") a storefront, order and inventory tools, and a way to get paid. Strand is the platform; each shop is run by its own independent seller, not by Strand.</p>'
+'<h3>2. Accounts</h3><p class="mu">You must give accurate information to create an account and keep your login details secure. You are responsible for activity under your account, including any staff you add with team access.</p>'
+'<h3>3. Fees and plans</h3><p class="mu">Basic access is free. Sellers pay a monthly subscription only for Plus or Pro access, as described on our pricing page. On the Basic plan, Strand keeps 1.5% of payments made online through Strand (Paystack, card or mobile money) at the time of payment; this does not apply to cash, pay-on-delivery, WhatsApp-arranged payments, or your own payment link or Paystack account. Plus and Pro take no commission on what you sell. Fees already paid are not refunded except where required by law.</p>'
+'<h3>4. Getting paid</h3><p class="mu">By default, payments you accept online (card or mobile money through Paystack), by mobile money transfer, or by payment link go straight to your own account — Strand never holds or touches that money. If you ask Strand to collect payments on your behalf because you do not yet have your own Paystack account, a separate, clearly stated fee applies to that service, and funds are passed on to you.</p>'
+'<h3>5. What you can sell</h3><p class="mu">You may not list anything illegal, counterfeit, stolen, or that infringes someone else\'s rights, and you are responsible for the accuracy of your own listings, pricing and stock.</p>'
+'<h3>6. Your content</h3><p class="mu">You keep ownership of your shop name, product photos, descriptions and brand. You give Strand permission to display them as part of running your storefront.</p>'
+'<h3>7. Suspension and termination</h3><p class="mu">We may suspend or close an account that breaks these terms, is used fraudulently, or puts other users at risk. You can close your own account at any time.</p>'
+'<h3>8. No guarantee</h3><p class="mu">Strand is provided "as is." We work to keep it reliable and secure but cannot guarantee uninterrupted service, and are not responsible for disputes between a seller and their customers.</p>'
+'<h3>9. Changes</h3><p class="mu">We may update these terms as Strand grows. We will show a notice in the app when a change is significant.</p>'
+'<h3>10. Contact</h3><p class="mu">Questions about these terms can be sent to the email address shown in the app footer.</p>')}
function privacy(){legalPage('Privacy Policy','<p class="mu">Last updated: '+new Date().toLocaleDateString()+'. This explains what we collect and why, in plain language.</p>'
+'<h3>1. What we collect</h3><p class="mu">From sellers: shop name, phone number, email, password (stored scrambled, never in plain text), the products and settings you add, and payment details you choose to connect (we store your Paystack key encrypted; we never see or store card numbers — those go straight to Paystack). From customers: name, phone number, delivery address and order details you give a shop at checkout.</p>'
+'<h3>2. Why we collect it</h3><p class="mu">To run your shop and process orders, to show you your own orders and stock, to send order and security notifications, to prevent fraud and abuse, and to improve Strand.</p>'
+'<h3>3. Who sees it</h3><p class="mu">A customer\'s order details are visible to the shop they ordered from and to Strand. We do not sell personal data to third parties. We share data with service providers only as needed to run the platform — for example Paystack for payments, or an email provider to send notifications.</p>'
+'<h3>4. Where it is stored</h3><p class="mu">Account and order data is stored on our hosting providers\' servers with encryption for sensitive fields like payment keys and passwords.</p>'
+'<h3>5. Your choices</h3><p class="mu">You can edit or remove your shop\'s information at any time from your dashboard. You can ask us to delete your account and associated data by contacting us, except where we must keep records for legal or accounting reasons.</p>'
+'<h3>6. Cookies and local storage</h3><p class="mu">We use your browser\'s local storage to keep you signed in and remember basic preferences. We do not use advertising trackers.</p>'
+'<h3>7. Children</h3><p class="mu">Strand is not directed at children, and accounts should only be created by adults able to enter into these terms.</p>'
+'<h3>8. Changes</h3><p class="mu">If we make a significant change to this policy, we will show a notice in the app.</p>'
+'<h3>9. Contact</h3><p class="mu">Questions about your data can be sent to the email address shown in the app footer.</p>')}

var LAST_ORDER=null;
function downloadReceipt(){if(!LAST_ORDER)return;var o=LAST_ORDER,DPR=2,W=640;var rows=o.items.map(function(i){return{name:i.name,sub:i.qty+' × '+money(i.price),total:money(i.price*i.qty)}});var payLabel=(o.pay&&PAYN[o.pay])?PAYN[o.pay][0]:(o.pay==='pos'?'Paid in person':'Order');var lines=[{t:'sub',k:'Subtotal',v:money(o.sub!=null?o.sub:o.total)}];if(o.disc)lines.push({t:'sub',k:'Discount'+(o.code?' ('+o.code+')':''),v:'−'+money(o.disc)});if(o.fee)lines.push({t:'sub',k:'Delivery',v:money(o.fee)});var rcode=ST.receiptCode||'none';var codeH=rcode==='qr'?176:rcode==='barcode'?58:0;var rowH=54,headH=168+codeH,subH=lines.length*30+14,totH=56,payH=66,footH=74,pad=40;var H=headH+18+rows.length*rowH+18+subH+totH+payH+footH;var cv=document.createElement('canvas');cv.width=W*DPR;cv.height=H*DPR;var x=cv.getContext('2d');x.scale(DPR,DPR);x.fillStyle='#fff';x.fillRect(0,0,W,H);var ink='#111',mu='#6b6b72',line='#e4e4e7',red='#d4001a';function text(s,fx,fy,font,color,align){x.font=font;x.fillStyle=color||ink;x.textAlign=align||'left';x.fillText(s,fx,fy)}function hr(y){x.strokeStyle=line;x.lineWidth=1;x.beginPath();x.moveTo(pad,y);x.lineTo(W-pad,y);x.stroke()}function ellip(s,maxW,font){x.font=font;if(x.measureText(s).width<=maxW)return s;while(s.length>1&&x.measureText(s+'…').width>maxW){s=s.slice(0,-1)}return s+'…'}x.fillStyle=red;x.beginPath();x.roundRect(pad,16,28,28,8);x.fill();x.textAlign='center';x.font='700 15px Inter, Arial';x.fillStyle='#fff';x.fillText('S',pad+14,36);x.textAlign='left';text('Strand','700 17px Inter, Arial',pad+34,33,ink);text('Receipt','600 13px Inter, Arial',W-pad,27,mu,'right');text(ellip(o.shop,W-pad*2,'700 24px Inter, Arial'),pad,80,'700 24px Inter, Arial',ink);text('Order '+o.no,pad,106,'600 14px Menlo, monospace',red);text(new Date(o.at).toLocaleString(),pad,128,'13px Inter, Arial',mu);var itemsY0=150+codeH;if(rcode==='barcode'){var bx=pad,by=146,bh=46,bw=W-pad*2,seed=o.no.split('').reduce(function(a,c){return a+c.charCodeAt(0)},1);function rnd(n){seed=(seed*9301+49297)%233280;return(seed/233280)*n}var cx2=bx;while(cx2<bx+bw-4){var bw2=1+Math.round(rnd(3));x.fillStyle=ink;x.fillRect(cx2,by,bw2,bh);cx2+=bw2+1+Math.round(rnd(2))}text(o.no.split('').join(' '),W/2,by+bh+16,'600 11px Menlo, monospace',mu,'center');}else if(rcode==='qr'){var qSize=132,qy=142,qx=(W-qSize)/2;if(typeof qrcode==='function'){try{var qr=qrcode(0,'M');qr.addData(location.origin+'/s/'+ST.slug+'?track='+o.no);qr.make();var qn=qr.getModuleCount(),cell=qSize/qn;x.fillStyle=ink;for(var qr_r=0;qr_r<qn;qr_r++){for(var qr_c=0;qr_c<qn;qr_c++){if(qr.isDark(qr_r,qr_c))x.fillRect(qx+qr_c*cell,qy+qr_r*cell,cell+0.6,cell+0.6)}}text('Scan to look up this order',W/2,qy+qSize+24,'600 11px Inter, Arial',mu,'center')}catch(e){text('Order '+o.no,W/2,qy+40,'700 16px Menlo, monospace',mu,'center')}}else{text('Order '+o.no,W/2,qy+40,'700 16px Menlo, monospace',mu,'center')}}hr(itemsY0);var y=itemsY0+32;rows.forEach(function(r){text(ellip(r.name,320,'600 15px Inter, Arial'),pad,y,'600 15px Inter, Arial',ink);text(r.sub,pad,y+20,'13px Inter, Arial',mu);text(r.total,W-pad,y+8,'700 15px Inter, Arial',ink,'right');y+=rowH;});hr(y+2);y+=2;y+=28;lines.forEach(function(l){text(l.k,pad,y,'14px Inter, Arial',mu);text(l.v,W-pad,y,'14px Inter, Arial',ink,'right');y+=30});y+=6;hr(y);y+=38;text('Total',pad,y,'800 20px Inter, Arial',ink);text(money(o.total),W-pad,y,'800 20px Inter, Arial',ink,'right');y+=38;text(payLabel+(o.eta?' · Est. delivery '+o.eta:''),pad,y,'13px Inter, Arial',mu);y+=22;text('For '+o.name,pad,y,'13px Inter, Arial',mu);y+=34;hr(y);y+=30;text('Powered by Strand — strand.app',W/2,y,'600 12px Inter, Arial',mu,'center');y+=18;text(o.shop+' is an independent business on Strand.',W/2,y,'11px Inter, Arial',mu,'center');cv.toBlob(function(b){var u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='receipt-'+o.no+'.png';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1000);});}
function place(){var em=$('cem')&&$('cem').value.trim();if(!em||!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(em)){$('ce').textContent='Enter a valid email address.';$('cem').focus();return}var hp=document.getElementById('ohp');var itemsFull=ST.products.filter(function(p){return CART[p.id]}).map(function(p){return{name:p.name,price:p.price,qty:CART[p.id]}}),items=Object.keys(CART).filter(function(k){return CART[k]}).map(function(k){return{id:k,qty:CART[k]}}),pm=document.querySelector('input[name=pm]:checked'),buyerName=$('cn').value;capi('POST','/api/order',{slug:ST.slug,items:items,name:buyerName,phone:$('cp').value,address:$('ca').value,note:$('cm').value,email:em,pay:pm&&pm.value,hp:hp?hp.value:'',code:$('cc')?$('cc').value:'',saveAddress:!!($('csa')&&$('csa').checked),deliver:!!(document.querySelector('input[name=dm]:checked')&&document.querySelector('input[name=dm]:checked').value==='d')}).then(function(r){LAST_ORDER={no:r.no,total:r.total,sub:r.sub,fee:r.fee,disc:r.disc,code:r.code,pay:r.pay,items:itemsFull,name:buyerName,shop:ST.name,eta:r.eta||'',at:Date.now()};CART={};api('GET','/api/store/'+ST.slug).then(function(x){ST=x.store;drawShop()});var pay='';if(r.payUrl)pay='<a class="btn" style="text-decoration:none" href="'+r.payUrl+'">Pay '+money(r.total)+' now</a>';else if(r.pay==='momo')pay='<div class="card"><b>Send '+money(r.total)+' by mobile money</b><div style="margin-top:6px">'+esc(r.momo.net||'')+' · <b>'+esc(r.momo.number)+'</b><br>'+esc(r.momo.name||'')+'<br><span class="mu">Use '+r.no+' as the reference.</span></div></div>';else if(r.link)pay='<a class="btn" style="text-decoration:none" href="'+esc(r.link)+'" target="_blank" rel="noopener">Open payment link</a>';else if(r.pay==='cod')pay='<p class="mu">You will pay '+money(r.total)+' on delivery.</p>';if(r.payNote)pay+='<p class="mu">'+esc(r.payNote)+'</p>';sheet('<h2>Order sent</h2><p>Your order <b>'+r.no+'</b> for '+money(r.total)+' is with '+esc(ST.name)+'.</p>'+(r.eta?'<p class="mu">📦 Estimated delivery function custSignup(){var hp=$('ahp');capi('POST','/api/customer/signup',{name:$('an').value,phone:$('ap').value,email:$('ae').value,pin:$('ak2').value,hp:hp?hp.value:''}).then(custAcctSave).catch(function(e){$('ae1').textContent=e.message})}
